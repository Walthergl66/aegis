services:
  backend:
    build: ./backend
    image: supabase-backups-api:latest
    container_name: supabase-backups-api
    restart: unless-stopped
    user: "1000:1000"
    env_file: ./backend/.env
    expose:
      - "8080"
    ports:
      - "127.0.0.1:8080:8080" # API privada; publicar remotamente solo por Tailscale Serve
    volumes:
      - ./data:/data                # SQLite + backups persistidos fuera del contenedor
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
